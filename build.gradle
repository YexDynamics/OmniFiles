plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
	//Genera pruebas de cobvertura
	id 'jacoco'
	//plugin sonarQube
	//id "org.sonarqube" version "4.4.1.3373"
	//plugin allure reports
	id "io.qameta.allure" version "3.0.2"
}

group = 'com.eam'
version = '1.0.0'
description = 'Demo API con Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.mockito:mockito-core:5.11.0'
	testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'

	// https://mvnrepository.com/artifact/org.springdoc/springdoc-openapi-starter-webmvc-ui
	implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.12")
	testImplementation 'io.qameta.allure:allure-junit5:2.34.0'

	// MapStruct para mapeo automático
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	// Para usar MapStruct con Lombok
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
}

tasks.named('test') {
	useJUnitPlatform()

	//tras los test se generan los reportes con JaCoCO + Allure
	//finalizedBy jacocoTestReport, allureReport
}

jacoco{
	toolVersion = "0.8.10"
}
jacocoTestReport{
	dependsOn test
	reports{
		xml.required = true
		html.required = true
	}
	finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification{
	violationRules{
		rule{
			limit{
				//cambiar a que exia al menos el 80%
				minimum = 0.30
			}
		}
	}
}

allure{
	version = "2.34.0"
	autoconfigure = true
	aspectjweaver = true
}